{{ $baseURL := strings.TrimSpace (printf "%v" site.BaseURL) }}
{{ $siteSearchTarget := $baseURL }}
{{ with urls.Parse $baseURL }}
  {{ with .Host }}
    {{ $siteSearchTarget = . }}
  {{ end }}
{{ end }}

<form
  class="home-search"
  action="https://www.google.com/search"
  method="get"
  data-search-form
  data-search-site="{{ $siteSearchTarget }}"
>
  <label class="search-input-wrap home-search-input-wrap">
    <span class="visually-hidden">Google 搜索本站</span>
    <input
      type="search"
      name="q"
      class="search-input home-search-input"
      data-search-input
      placeholder="Google 搜索本站"
      autocomplete="off"
      spellcheck="false"
    />
  </label>
  <button type="submit" class="search-trigger" aria-label="使用 Google 搜索本站" title="Google 搜索本站">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"
      />
    </svg>
  </button>
</form>
