theme = "haku"
baseURL = "https://example.org/"
locale = "zh-CN"
title = "Haku Example"
enableRobotsTXT = true
disablePathToLower = true

[taxonomies]
tag = "tags"

[pagination]
pagerSize = 7
path = "page"

[outputs]
home = ["HTML", "RSS", "FullRSS"]

[outputFormats.RSS]
baseName = "rss"

[outputFormats.FullRSS]
baseName = "rss-full"
mediaType = "application/rss+xml"
protocol = "inline"
isPlainText = false
noUgly = true
permalinkable = false

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[params]
subtitle = "Theme preview"
description = "Example site for the Haku theme"
mainSections = ["posts"]

[params.seo]
defaultImage = "/og-default.png"
logo = "/favicon.png"
favicon = "/favicon.png"

[params.posts]
excerptLength = 60

[params.author]
name = "Haku"

[params.copyright]
enabled = false

[markup]
  [markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false
  [markup.goldmark]
    [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
      block = true
      title = true
    [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
  codeFences = true
  guessSyntax = true
  lineNos = false
  noClasses = true
